<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>slide-stack · WissMotion</title>
    <style>
      html,
      body {
        margin: 0;
        background: #111;
      }
      #stage {
        position: relative;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #faf9f7;
      }
      .card {
        position: absolute;
        left: 120px;
        width: 400px;
        padding: 24px 32px;
        border-radius: 16px;
        background: #ffffff;
        font:
          600 40px Inter,
          sans-serif;
        color: #1c1917;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      }
      #c1 {
        top: 120px;
      }
      #c2 {
        top: 280px;
      }
      #c3 {
        top: 440px;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="slide-stack"
      data-start="0"
      data-width="1280"
      data-height="720"
    >
      <div id="c1" class="card clip" data-start="0.5" data-duration="2" data-track-index="0">
        Uno
      </div>
      <div id="c2" class="card clip" data-start="0.5" data-duration="2" data-track-index="1">
        Dos
      </div>
      <div id="c3" class="card clip" data-start="0.5" data-duration="2" data-track-index="2">
        Tres
      </div>
      <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.from(
          ".card",
          { y: 60, opacity: 0, duration: 0.6, ease: "power3.out", stagger: 0.08 },
          0.5,
        );
        window.__timelines = window.__timelines || {};
        window.__timelines["slide-stack"] = tl;
      </script>
    </div>
  </body>
</html>
