<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>stagger-words · WissMotion</title>
    <style>
      html,
      body {
        margin: 0;
        background: #111;
      }
      #stage {
        position: relative;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #faf9f7;
      }
      #t {
        position: absolute;
        left: 120px;
        top: 300px;
        margin: 0;
        font:
          700 96px Inter,
          sans-serif;
        color: #1c1917;
        overflow: hidden;
      }
      .w {
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="stagger-words"
      data-start="0"
      data-width="1280"
      data-height="720"
    >
      <h1 id="t" class="clip" data-start="0.5" data-duration="2" data-track-index="0">
        <span class="w">Hola</span> <span class="w">mundo</span> <span class="w">nuevo</span>
      </h1>
      <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.from(
          "#t .w",
          { y: "100%", opacity: 0, duration: 0.7, ease: "power3.out", stagger: 0.06 },
          0.5,
        );
        window.__timelines = window.__timelines || {};
        window.__timelines["stagger-words"] = tl;
      </script>
    </div>
  </body>
</html>
