<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>blur-out · WissMotion</title>
    <style>
      html,
      body {
        margin: 0;
        background: #111;
      }
      #stage {
        position: relative;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #0b1220;
      }
      #t {
        position: absolute;
        left: 120px;
        top: 300px;
        margin: 0;
        font:
          700 96px Inter,
          sans-serif;
        color: #f5f5f4;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="blur-out"
      data-start="0"
      data-width="1280"
      data-height="720"
    >
      <h1 id="t" class="clip" data-start="0.5" data-duration="2" data-track-index="0">Difumina</h1>
      <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.from("#t", { opacity: 0, duration: 0.4, ease: "power2.out" }, 0.5);
        tl.to("#t", { opacity: 0, filter: "blur(12px)", duration: 0.5, ease: "power2.in" }, 1.5);
        window.__timelines = window.__timelines || {};
        window.__timelines["blur-out"] = tl;
      </script>
    </div>
  </body>
</html>
