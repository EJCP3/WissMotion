<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>feature-grid · WissMotion</title>
    <style>
      html,
      body {
        margin: 0;
        background: #111;
      }
      #stage {
        position: relative;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #0b1220;
      }
      .feat {
        position: absolute;
        width: 440px;
        padding: 36px;
        border-radius: 20px;
        background: #1c1917;
        color: #f5f5f4;
        font:
          600 44px Inter,
          sans-serif;
      }
      #f1 {
        left: 140px;
        top: 110px;
      }
      #f2 {
        left: 700px;
        top: 110px;
      }
      #f3 {
        left: 140px;
        top: 380px;
      }
      #f4 {
        left: 700px;
        top: 380px;
      }
      .feat b {
        display: block;
        font-size: 28px;
        color: #f59e0b;
        margin-bottom: 8px;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="feature-grid"
      data-start="0"
      data-width="1280"
      data-height="720"
    >
      <div id="f1" class="feat clip" data-start="0.3" data-duration="2.5" data-track-index="0">
        <b>01</b>Marca
      </div>
      <div id="f2" class="feat clip" data-start="0.3" data-duration="2.5" data-track-index="1">
        <b>02</b>Plantillas
      </div>
      <div id="f3" class="feat clip" data-start="0.3" data-duration="2.5" data-track-index="2">
        <b>03</b>Música
      </div>
      <div id="f4" class="feat clip" data-start="0.3" data-duration="2.5" data-track-index="3">
        <b>04</b>Exporta
      </div>
      <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.from(
          ".feat",
          {
            scale: 0.9,
            opacity: 0,
            duration: 0.6,
            ease: "power2.out",
            stagger: { each: 0.12, from: "start" },
          },
          0.3,
        );
        window.__timelines = window.__timelines || {};
        window.__timelines["feature-grid"] = tl;
      </script>
    </div>
  </body>
</html>
