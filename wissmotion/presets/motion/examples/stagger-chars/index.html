<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>stagger-chars · WissMotion</title>
    <style>
      html,
      body {
        margin: 0;
        background: #111;
      }
      #stage {
        position: relative;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #d9e0ef;
      }
      #t {
        position: absolute;
        left: 0;
        right: 0;
        top: 290px;
        margin: 0;
        text-align: center;
        font:
          italic 900 120px Inter,
          sans-serif;
        color: #8b90a6;
      }
      .ch {
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="stagger-chars"
      data-start="0"
      data-width="1280"
      data-height="720"
    >
      <h1 id="t" class="clip" data-start="0.3" data-duration="2.2" data-track-index="0">
        <span class="ch">M</span><span class="ch">O</span><span class="ch">T</span
        ><span class="ch">I</span><span class="ch">O</span><span class="ch">N</span>
      </h1>
      <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.from(
          "#t .ch",
          {
            y: "60%",
            rotation: 20,
            opacity: 0,
            duration: 0.6,
            ease: "back.out(1.4)",
            stagger: 0.05,
          },
          0.3,
        );
        window.__timelines = window.__timelines || {};
        window.__timelines["stagger-chars"] = tl;
      </script>
    </div>
  </body>
</html>
