<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>device-mockup-scroll · WissMotion</title>
    <style>
      html,
      body {
        margin: 0;
        background: #111;
      }
      #stage {
        position: relative;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #0b1220;
      }
      #phone {
        position: absolute;
        left: 490px;
        top: 60px;
        width: 300px;
        height: 600px;
        border-radius: 44px;
        background: #000;
        padding: 12px;
      }
      #screen {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 34px;
        overflow: hidden;
        background: #faf9f7;
      }
      .row {
        margin: 16px;
        height: 72px;
        border-radius: 12px;
        background: #e7e5e4;
      }
      .row.hero {
        height: 160px;
        background: #6d28d9;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="device-mockup-scroll"
      data-start="0"
      data-width="1280"
      data-height="720"
    >
      <div id="phone" class="clip" data-start="0.3" data-duration="2.5" data-track-index="0">
        <div id="screen">
          <div class="row hero"></div>
          <div class="row"></div>
          <div class="row"></div>
          <div class="row"></div>
          <div class="row"></div>
        </div>
      </div>
      <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.from("#phone", { y: 80, opacity: 0, duration: 0.7, ease: "power3.out" }, 0.3);
        tl.to("#screen", { y: -160, duration: 1.2, ease: "power2.inOut" }, 1.0);
        window.__timelines = window.__timelines || {};
        window.__timelines["device-mockup-scroll"] = tl;
      </script>
    </div>
  </body>
</html>
