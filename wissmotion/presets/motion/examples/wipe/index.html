<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>wipe · WissMotion</title>
    <style>
      html,
      body {
        margin: 0;
        background: #111;
      }
      #stage {
        position: relative;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #faf9f7;
      }
      #bar {
        position: absolute;
        left: 0;
        top: 320px;
        width: 1280px;
        height: 80px;
        background: #6d28d9;
      }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="wipe" data-start="0" data-width="1280" data-height="720">
      <div id="bar" class="clip" data-start="0.5" data-duration="2" data-track-index="0"></div>
      <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.from(
          "#bar",
          { scaleX: 0, transformOrigin: "left center", duration: 0.7, ease: "power3.inOut" },
          0.5,
        );
        window.__timelines = window.__timelines || {};
        window.__timelines["wipe"] = tl;
      </script>
    </div>
  </body>
</html>
