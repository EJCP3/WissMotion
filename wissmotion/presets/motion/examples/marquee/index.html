<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>marquee · WissMotion</title>
    <style>
      html,
      body {
        margin: 0;
        background: #111;
      }
      #stage {
        position: relative;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #5b3df5;
      }
      /* Banda inclinada; cada fila lleva su texto dos veces para que -50% cierre el bucle. */
      #band {
        position: absolute;
        left: -200px;
        right: -200px;
        top: 90px;
        transform: rotate(-10deg);
        font:
          900 112px/1.1 Inter,
          sans-serif;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .row {
        display: flex;
        width: max-content;
      }
      .row span {
        padding-right: 0.5em;
      }
      .fill {
        color: #d4ff3a;
      }
      .solid {
        color: #ffffff;
      }
      .outline {
        color: transparent;
        -webkit-text-stroke: 2px rgba(255, 255, 255, 0.55);
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="marquee"
      data-start="0"
      data-width="1280"
      data-height="720"
    >
      <div id="band" class="clip" data-start="0" data-duration="6" data-track-index="0">
        <div class="row r1 outline">
          <span>Site pages · Client decks · Infographics ·</span
          ><span>Site pages · Client decks · Infographics ·</span>
        </div>
        <div class="row r2 fill">
          <span>Launch films · Motion · UI design ·</span
          ><span>Launch films · Motion · UI design ·</span>
        </div>
        <div class="row r3 solid">
          <span>Social content · Templates · Slides ·</span
          ><span>Social content · Templates · Slides ·</span>
        </div>
        <div class="row r4 outline">
          <span>Diagrams · Product films · Brand ·</span
          ><span>Diagrams · Product films · Brand ·</span>
        </div>
      </div>
      <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
      <script>
        const tl = gsap.timeline({ paused: true });
        // Filas alternas en sentidos opuestos: mismo preset, from/to invertidos.
        tl.fromTo(
          "#band .r1, #band .r3",
          { xPercent: 0 },
          { xPercent: -50, duration: 6, ease: "none" },
          0,
        );
        tl.fromTo(
          "#band .r2, #band .r4",
          { xPercent: -50 },
          { xPercent: 0, duration: 6, ease: "none" },
          0,
        );
        window.__timelines = window.__timelines || {};
        window.__timelines["marquee"] = tl;
      </script>
    </div>
  </body>
</html>
