<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>flip-3d · WissMotion</title>
    <style>
      html,
      body {
        margin: 0;
        background: #111;
      }
      #stage {
        position: relative;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: linear-gradient(180deg, #8cf3fb 0%, #e6fdff 100%);
      }
      #card {
        position: absolute;
        left: 460px;
        top: 130px;
        width: 360px;
        height: 460px;
        box-sizing: border-box;
        padding: 32px;
        border-radius: 28px;
        background: #ffffff;
        box-shadow: 0 30px 60px rgba(14, 80, 96, 0.18);
        font-family: Inter, sans-serif;
        color: #0f2a33;
      }
      #card h2 {
        margin: 0;
        font-size: 26px;
        font-weight: 700;
      }
      #card p {
        margin: 18px 0 0;
        font-size: 44px;
        font-weight: 600;
      }
      .bars {
        position: absolute;
        left: 32px;
        right: 32px;
        bottom: 40px;
        height: 200px;
        display: flex;
        align-items: flex-end;
        gap: 18px;
      }
      .bars span {
        flex: 1;
        border-radius: 8px;
        background: #3fd3e0;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="flip-3d"
      data-start="0"
      data-width="1280"
      data-height="720"
    >
      <div id="card" class="clip" data-start="0.3" data-duration="2.2" data-track-index="0">
        <h2>Sleep</h2>
        <p>6h 31m</p>
        <div class="bars">
          <span style="height: 82%"></span><span style="height: 74%"></span
          ><span style="height: 66%"></span><span style="height: 90%"></span
          ><span style="height: 70%"></span><span style="height: 58%"></span
          ><span style="height: 76%"></span>
        </div>
      </div>
      <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(
          "#card",
          { rotationY: 90, transformPerspective: 1200, opacity: 0 },
          {
            rotationY: 0,
            transformPerspective: 1200,
            opacity: 1,
            duration: 0.9,
            ease: "power3.out",
          },
          0.3,
        );
        window.__timelines = window.__timelines || {};
        window.__timelines["flip-3d"] = tl;
      </script>
    </div>
  </body>
</html>
