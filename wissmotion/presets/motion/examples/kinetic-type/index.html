<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>kinetic-type · WissMotion</title>
    <style>
      html,
      body {
        margin: 0;
        background: #111;
      }
      #stage {
        position: relative;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #6d28d9;
      }
      .line {
        margin: 0;
        font:
          700 110px Inter,
          sans-serif;
        color: #faf9f7;
        overflow: hidden;
        line-height: 1.15;
      }
      #l1 {
        position: absolute;
        left: 120px;
        top: 150px;
      }
      #l2 {
        position: absolute;
        left: 120px;
        top: 290px;
        color: #f59e0b;
      }
      #l3 {
        position: absolute;
        left: 120px;
        top: 430px;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="kinetic-type"
      data-start="0"
      data-width="1280"
      data-height="720"
    >
      <p id="l1" class="line clip" data-start="0.3" data-duration="2.5" data-track-index="0">
        Crea.
      </p>
      <p id="l2" class="line clip" data-start="0.3" data-duration="2.5" data-track-index="1">
        Anima.
      </p>
      <p id="l3" class="line clip" data-start="0.3" data-duration="2.5" data-track-index="2">
        Publica.
      </p>
      <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.from(".line", { y: "110%", duration: 0.7, ease: "power4.out", stagger: 0.15 }, 0.3);
        window.__timelines = window.__timelines || {};
        window.__timelines["kinetic-type"] = tl;
      </script>
    </div>
  </body>
</html>
