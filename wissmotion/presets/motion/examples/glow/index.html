<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>glow · WissMotion</title>
    <style>
      html,
      body {
        margin: 0;
        background: #111;
      }
      #stage {
        position: relative;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #0b1220;
      }
      #t {
        position: absolute;
        left: 120px;
        top: 300px;
        margin: 0;
        font:
          700 96px Inter,
          sans-serif;
        color: #f5f5f4;
        text-shadow:
          0 0 24px #6d28d9,
          0 0 64px #6d28d9;
      }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="glow" data-start="0" data-width="1280" data-height="720">
      <h1 id="t" class="clip" data-start="0.5" data-duration="2" data-track-index="0">Brilla</h1>
      <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(
          "#t",
          { opacity: 0.55 },
          { opacity: 1, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 1 },
          0.5,
        );
        window.__timelines = window.__timelines || {};
        window.__timelines["glow"] = tl;
      </script>
    </div>
  </body>
</html>
