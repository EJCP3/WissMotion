<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>tr-morph · WissMotion</title>
    <style>
      html,
      body {
        margin: 0;
        background: #111;
      }
      #stage {
        position: relative;
        width: 1280px;
        height: 720px;
        overflow: hidden;
      }
      .scene {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font:
          700 120px Inter,
          sans-serif;
      }
      #a {
        background: #faf9f7;
        color: #1c1917;
      }
      #b {
        background: #1c1917;
        color: #faf9f7;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="tr-morph"
      data-start="0"
      data-width="1280"
      data-height="720"
    >
      <div id="a" class="scene clip" data-start="0" data-duration="2.6" data-track-index="0">
        Uno
      </div>
      <div id="b" class="scene clip" data-start="2" data-duration="2.6" data-track-index="1">
        Dos
      </div>
      <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.to("#a", { opacity: 0, scale: 1.04, duration: 0.6, ease: "sine.inOut" }, 2.0);
        tl.fromTo(
          "#b",
          { opacity: 0, scale: 0.97 },
          { opacity: 1, scale: 1, duration: 0.6, ease: "sine.inOut" },
          2.0,
        );
        window.__timelines = window.__timelines || {};
        window.__timelines["tr-morph"] = tl;
      </script>
    </div>
  </body>
</html>
