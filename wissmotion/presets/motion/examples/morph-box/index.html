<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>morph-box · WissMotion</title>
    <style>
      html,
      body {
        margin: 0;
        background: #111;
      }
      #stage {
        position: relative;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: linear-gradient(160deg, #cfe6f3 0%, #5aa9d6 55%, #2f86bd 100%);
      }
      #card {
        position: absolute;
        left: 440px;
        top: 150px;
        width: 400px;
        height: 420px;
        box-sizing: border-box;
        padding: 36px;
        border-radius: 32px;
        background: #0d0d0f;
        font-family: Inter, sans-serif;
        color: #f5f5f4;
      }
      #card .tag {
        display: inline-block;
        padding: 6px 14px;
        border-radius: 999px;
        background: #ffd60a;
        color: #0d0d0f;
        font-size: 18px;
        font-weight: 700;
      }
      #card .route {
        display: flex;
        justify-content: space-between;
        margin-top: 150px;
        font:
          700 56px "JetBrains Mono",
          monospace;
      }
      #card .bar {
        height: 8px;
        margin-top: 28px;
        border-radius: 4px;
        background: linear-gradient(90deg, #f5f5f4 62%, #3a3a3f 62%);
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="morph-box"
      data-start="0"
      data-width="1280"
      data-height="720"
    >
      <div id="card" class="clip" data-start="0" data-duration="2.6" data-track-index="0">
        <span class="tag">GATE 34-F</span>
        <div class="route"><span>PAR</span><span>NYC</span></div>
        <div class="bar"></div>
      </div>
      <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(
          "#card",
          { clipPath: "inset(44% 30% 44% 30% round 120px)" },
          { clipPath: "inset(0% 0% 0% 0% round 32px)", duration: 0.9, ease: "expo.inOut" },
          0.4,
        );
        window.__timelines = window.__timelines || {};
        window.__timelines["morph-box"] = tl;
      </script>
    </div>
  </body>
</html>
