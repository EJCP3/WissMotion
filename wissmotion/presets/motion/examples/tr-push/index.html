<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>tr-push · WissMotion</title>
    <style>
      html,
      body {
        margin: 0;
        background: #111;
      }
      #stage {
        position: relative;
        width: 1280px;
        height: 720px;
        overflow: hidden;
      }
      .scene {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font:
          700 120px Inter,
          sans-serif;
      }
      #a {
        background: #6d28d9;
        color: #fff;
      }
      #b {
        background: #0ea5e9;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="tr-push"
      data-start="0"
      data-width="1280"
      data-height="720"
    >
      <div id="a" class="scene clip" data-start="0" data-duration="2.6" data-track-index="0">
        Uno
      </div>
      <div id="b" class="scene clip" data-start="2" data-duration="2.6" data-track-index="1">
        Dos
      </div>
      <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.to("#a", { x: -1280, duration: 0.6, ease: "power3.inOut" }, 2.0);
        tl.fromTo("#b", { x: 1280 }, { x: 0, duration: 0.6, ease: "power3.inOut" }, 2.0);
        window.__timelines = window.__timelines || {};
        window.__timelines["tr-push"] = tl;
      </script>
    </div>
  </body>
</html>
