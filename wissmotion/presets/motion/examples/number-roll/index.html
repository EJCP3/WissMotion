<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>number-roll · WissMotion</title>
    <style>
      html,
      body {
        margin: 0;
        background: #111;
      }
      #stage {
        position: relative;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #0b1220;
      }
      #roll {
        position: absolute;
        left: 120px;
        top: 280px;
        height: 1em;
        overflow: hidden;
        font:
          700 120px Inter,
          sans-serif;
        line-height: 1;
        color: #f5f5f4;
        font-variant-numeric: tabular-nums;
      }
      #strip {
        display: block;
      }
      #strip span {
        display: block;
        height: 1em;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="number-roll"
      data-start="0"
      data-width="1280"
      data-height="720"
    >
      <div id="roll" class="clip" data-start="0.5" data-duration="2" data-track-index="0">
        <span id="strip"
          ><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span
          ><span>6</span><span>7</span><span>8</span><span>9</span></span
        >
      </div>
      <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.to("#strip", { y: "-7em", duration: 1.2, ease: "power3.inOut" }, 0.5);
        window.__timelines = window.__timelines || {};
        window.__timelines["number-roll"] = tl;
      </script>
    </div>
  </body>
</html>
