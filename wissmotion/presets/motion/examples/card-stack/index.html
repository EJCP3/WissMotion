<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>card-stack · WissMotion</title>
    <style>
      html,
      body {
        margin: 0;
        background: #111;
      }
      #stage {
        position: relative;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: radial-gradient(circle at 30% 20%, #4a4a4f 0%, #141416 70%);
      }
      #stack {
        position: absolute;
        left: 490px;
        top: 200px;
        width: 300px;
        height: 320px;
      }
      .card {
        position: absolute;
        inset: 0;
        box-sizing: border-box;
        padding: 30px;
        border-radius: 36px;
        font-family: Inter, sans-serif;
      }
      .card small {
        font:
          500 18px "JetBrains Mono",
          monospace;
        letter-spacing: 0.06em;
      }
      .card b {
        position: absolute;
        left: 30px;
        bottom: 34px;
        font-size: 64px;
        line-height: 0.95;
      }
      /* La primera arriba: el orden de apilado no depende del DOM. */
      .c0 {
        z-index: 4;
        background: #e3240f;
        color: #fff;
      }
      .c1 {
        z-index: 3;
        background: #000;
        color: #fff;
      }
      .c2 {
        z-index: 2;
        background: #fff;
        color: #000;
      }
      .c3 {
        z-index: 1;
        background: #6b6b6b;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="card-stack"
      data-start="0"
      data-width="1280"
      data-height="720"
    >
      <div id="stack" class="clip" data-start="0" data-duration="4.6" data-track-index="0">
        <div class="card c0">
          <small>DISTANCE</small><b>4.56<br />km</b>
        </div>
        <div class="card c1"><small>MOVING TIME</small><b>10:21</b></div>
        <div class="card c2">
          <small>AVG HEART RATE</small><b>153<br />bpm</b>
        </div>
        <div class="card c3">
          <small>CALORIES</small><b>296<br />kcal</b>
        </div>
      </div>
      <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
      <script>
        const tl = gsap.timeline({ paused: true });
        const cards = gsap.utils.toArray("#stack .card");
        cards.forEach((card, i) => {
          const at = 0.3 + i * 1;
          tl.fromTo(
            card,
            { y: 36, scale: 0.9, opacity: 0.5 },
            { y: 0, scale: 1, opacity: 1, duration: 0.6, ease: "power3.inOut" },
            at,
          );
          if (i < cards.length - 1) {
            tl.to(
              card,
              { y: -60, scale: 1.04, opacity: 0, duration: 0.6, ease: "power3.inOut" },
              at + 0.9,
            );
          }
        });
        window.__timelines = window.__timelines || {};
        window.__timelines["card-stack"] = tl;
      </script>
    </div>
  </body>
</html>
