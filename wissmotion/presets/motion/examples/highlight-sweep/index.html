<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>highlight-sweep · WissMotion</title>
    <style>
      html,
      body {
        margin: 0;
        background: #111;
      }
      #stage {
        position: relative;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #faf9f7;
      }
      #t {
        position: absolute;
        left: 120px;
        top: 300px;
        margin: 0;
        font:
          700 96px Inter,
          sans-serif;
        color: #1c1917;
      }
      #hl {
        position: absolute;
        left: 0;
        right: 0;
        top: 0.12em;
        bottom: 0.08em;
        background: #f59e0b;
        opacity: 0.45;
        z-index: -1;
      }
      #wrap {
        position: relative;
        display: inline-block;
        z-index: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="highlight-sweep"
      data-start="0"
      data-width="1280"
      data-height="720"
    >
      <h1 id="t" class="clip" data-start="0.5" data-duration="2" data-track-index="0">
        <span id="wrap">Clave<span id="hl"></span></span>
      </h1>
      <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.from(
          "#hl",
          { scaleX: 0, transformOrigin: "left center", duration: 0.6, ease: "power3.out" },
          0.5,
        );
        window.__timelines = window.__timelines || {};
        window.__timelines["highlight-sweep"] = tl;
      </script>
    </div>
  </body>
</html>
