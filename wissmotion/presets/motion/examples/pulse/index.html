<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>pulse · WissMotion</title>
    <style>
      html,
      body {
        margin: 0;
        background: #111;
      }
      #stage {
        position: relative;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #faf9f7;
      }
      #t {
        position: absolute;
        left: 120px;
        top: 300px;
        margin: 0;
        font:
          700 96px Inter,
          sans-serif;
        color: #1c1917;
      }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="pulse" data-start="0" data-width="1280" data-height="720">
      <h1 id="t" class="clip" data-start="0.5" data-duration="2" data-track-index="0">Oferta</h1>
      <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.to("#t", { scale: 1.06, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0.5);
        window.__timelines = window.__timelines || {};
        window.__timelines["pulse"] = tl;
      </script>
    </div>
  </body>
</html>
