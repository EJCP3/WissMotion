<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>counter-up · WissMotion</title>
    <style>
      html,
      body {
        margin: 0;
        background: #111;
      }
      #stage {
        position: relative;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #faf9f7;
      }
      #t {
        position: absolute;
        left: 120px;
        top: 300px;
        margin: 0;
        font:
          700 96px Inter,
          sans-serif;
        color: #6d28d9;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="counter-up"
      data-start="0"
      data-width="1280"
      data-height="720"
    >
      <p id="t" class="clip" data-start="0.5" data-duration="2" data-track-index="0">0</p>
      <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
      <script>
        const counter = { value: 0 };
        const el = document.getElementById("t");
        const tl = gsap.timeline({ paused: true });
        tl.to(
          counter,
          {
            value: 100,
            duration: 1.5,
            ease: "power2.out",
            onUpdate: () => {
              el.textContent = String(Math.round(counter.value));
            },
          },
          0.5,
        );
        window.__timelines = window.__timelines || {};
        window.__timelines["counter-up"] = tl;
      </script>
    </div>
  </body>
</html>
