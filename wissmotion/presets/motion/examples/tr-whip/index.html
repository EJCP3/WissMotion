<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>tr-whip · WissMotion</title>
    <style>
      html,
      body {
        margin: 0;
        background: #111;
      }
      #stage {
        position: relative;
        width: 1280px;
        height: 720px;
        overflow: hidden;
      }
      .scene {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font:
          700 120px Inter,
          sans-serif;
      }
      #a {
        background: #0ea5e9;
        color: #fff;
      }
      #b {
        background: #f59e0b;
        color: #1c1917;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="tr-whip"
      data-start="0"
      data-width="1280"
      data-height="720"
    >
      <div id="a" class="scene clip" data-start="0" data-duration="2.5" data-track-index="0">
        Uno
      </div>
      <div id="b" class="scene clip" data-start="2.15" data-duration="2.5" data-track-index="1">
        Dos
      </div>
      <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.to("#a", { x: -1280, skewX: 8, duration: 0.35, ease: "power4.in" }, 2.15);
        tl.fromTo(
          "#b",
          { x: 1280, skewX: 8 },
          { x: 0, skewX: 0, duration: 0.35, ease: "power4.out" },
          2.15,
        );
        window.__timelines = window.__timelines || {};
        window.__timelines["tr-whip"] = tl;
      </script>
    </div>
  </body>
</html>
