<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>shake · WissMotion</title>
    <style>
      html,
      body {
        margin: 0;
        background: #111;
      }
      #stage {
        position: relative;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #faf9f7;
      }
      #t {
        position: absolute;
        left: 120px;
        top: 300px;
        margin: 0;
        font:
          700 96px Inter,
          sans-serif;
        color: #b91c1c;
      }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="shake" data-start="0" data-width="1280" data-height="720">
      <h1 id="t" class="clip" data-start="0.5" data-duration="2" data-track-index="0">Error</h1>
      <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.to(
          "#t",
          {
            keyframes: [{ x: -10 }, { x: 10 }, { x: -6 }, { x: 6 }, { x: 0 }],
            duration: 0.4,
            ease: "none",
          },
          0.5,
        );
        window.__timelines = window.__timelines || {};
        window.__timelines["shake"] = tl;
      </script>
    </div>
  </body>
</html>
