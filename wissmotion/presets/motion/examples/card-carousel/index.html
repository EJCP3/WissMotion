<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>card-carousel · WissMotion</title>
    <style>
      html,
      body {
        margin: 0;
        background: #111;
      }
      #stage {
        position: relative;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #faf9f7;
      }
      .slide {
        position: absolute;
        top: 170px;
        width: 560px;
        padding: 48px;
        border-radius: 24px;
        background: #ffffff;
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.12);
        font:
          600 56px Inter,
          sans-serif;
        color: #1c1917;
      }
      #s1 {
        left: 120px;
      }
      #s2 {
        left: 120px;
        background: #6d28d9;
        color: #fff;
      }
      #s3 {
        left: 120px;
        background: #0ea5e9;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="card-carousel"
      data-start="0"
      data-width="1280"
      data-height="720"
    >
      <div id="s1" class="slide clip" data-start="0.3" data-duration="2.5" data-track-index="0">
        Rápido
      </div>
      <div id="s2" class="slide clip" data-start="0.3" data-duration="2.5" data-track-index="1">
        Bonito
      </div>
      <div id="s3" class="slide clip" data-start="0.3" data-duration="2.5" data-track-index="2">
        Tuyo
      </div>
      <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.from(
          ".slide",
          { x: 120, opacity: 0, duration: 0.6, ease: "power3.out", stagger: 0.5 },
          0.3,
        );
        tl.to(
          ".slide",
          { x: -120, opacity: 0, duration: 0.4, ease: "power2.in", stagger: 0.5 },
          1.8,
        );
        window.__timelines = window.__timelines || {};
        window.__timelines["card-carousel"] = tl;
      </script>
    </div>
  </body>
</html>
