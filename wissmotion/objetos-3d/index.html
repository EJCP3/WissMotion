<!doctype html>
<html
  lang="es"
  data-composition-variables='[
    {"id":"objeto","type":"enum","label":"Objeto","options":["moneda","losas","tarjeta","modelo"],"default":"moneda"},
    {"id":"color","type":"color","label":"Color","default":"#2f55ff"},
    {"id":"colorDetalle","type":"color","label":"Color del detalle","default":"#ffffff"},
    {"id":"texto","type":"string","label":"Símbolo o texto","default":"$"},
    {"id":"metal","type":"number","label":"Metalizado (0-1)","default":0.6},
    {"id":"modeloSrc","type":"string","label":"Modelo GLB (objeto = modelo)","default":"modelos/pera.glb"},
    {"id":"tenir","type":"boolean","label":"Teñir el modelo con el color","default":false}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Objetos 3D · WissMotion</title>
    <style>
      /* Sin fondo: render a WebM/MOV con alfa. */
      html,
      body {
        margin: 0;
        background: transparent;
      }
      #stage {
        position: relative;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
      }
      #three-layer {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.2/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="objetos-3d"
      data-start="0"
      data-duration="4"
      data-no-timeline
      data-width="1080"
      data-height="1080"
    >
      <canvas
        id="three-layer"
        class="clip"
        data-start="0"
        data-duration="4"
        data-track-index="0"
      ></canvas>
      <script type="module">
        import * as THREE from "three";
        import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
        import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
        import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

        const DURATION = 4; // una vuelta completa: el clip hace bucle sin salto
        const vars = window.__hyperframes?.getVariables?.() ?? {};
        const objeto = vars.objeto ?? "moneda";
        const color = new THREE.Color(vars.color ?? "#2f55ff");
        const detalle = vars.colorDetalle ?? "#ffffff";
        const texto = String(vars.texto ?? "$");
        const metal = Math.min(1, Math.max(0, Number(vars.metal ?? 0.6)));
        const modeloSrc = String(vars.modeloSrc ?? "modelos/pera.glb");
        const tenir = vars.tenir === true;
        let lastTime = 0;

        const canvas = document.getElementById("three-layer");
        const renderer = new THREE.WebGLRenderer({
          canvas,
          alpha: true,
          antialias: true,
          preserveDrawingBuffer: true,
        });
        renderer.setSize(1080, 1080, false);
        renderer.setPixelRatio(1);
        renderer.setClearColor(0x000000, 0);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;

        const scene = new THREE.Scene();
        const pmrem = new THREE.PMREMGenerator(renderer);
        scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
        const key = new THREE.DirectionalLight(0xffffff, 2.2);
        key.position.set(3, 4, 5);
        scene.add(key);

        const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
        camera.position.set(0, 0, 8);

        // Cara con texto (canvas 2D → textura). Sin fuentes remotas: determinista.
        function faceTexture({ w, h, bg, draw }) {
          const c = document.createElement("canvas");
          c.width = w;
          c.height = h;
          const g = c.getContext("2d");
          g.fillStyle = bg;
          g.fillRect(0, 0, w, h);
          draw(g, w, h);
          const tex = new THREE.CanvasTexture(c);
          tex.colorSpace = THREE.SRGBColorSpace;
          tex.anisotropy = 8;
          return tex;
        }

        const shiny = (extra = {}) =>
          new THREE.MeshPhysicalMaterial({
            color,
            metalness: metal,
            roughness: 0.22,
            clearcoat: 1,
            clearcoatRoughness: 0.08,
            ...extra,
          });

        const root = new THREE.Group();
        scene.add(root);
        let baseRotation = new THREE.Euler(0, 0, 0);
        let turntable = true;

        if (objeto === "moneda") {
          const face = faceTexture({
            w: 1024,
            h: 1024,
            bg: `#${color.getHexString()}`,
            draw(g, w, h) {
              g.strokeStyle = detalle;
              g.globalAlpha = 0.55;
              g.lineWidth = 26;
              g.beginPath();
              g.arc(w / 2, h / 2, w * 0.4, 0, Math.PI * 2);
              g.stroke();
              g.globalAlpha = 1;
              g.fillStyle = detalle;
              g.font = `900 ${texto.length > 2 ? 300 : 520}px Arial, Helvetica, sans-serif`;
              g.textAlign = "center";
              g.textBaseline = "middle";
              g.fillText(texto, w / 2, h / 2 + 20);
            },
          });
          // La tapa del cilindro mapea la UV girada: se endereza el texto.
          face.center.set(0.5, 0.5);
          face.rotation = Math.PI / 2;
          const geo = new THREE.CylinderGeometry(1.5, 1.5, 0.26, 128, 1);
          const side = shiny({ roughness: 0.3 });
          const cap = shiny({ map: face, color: 0xffffff });
          const coin = new THREE.Mesh(geo, [side, cap, cap]);
          coin.rotation.x = Math.PI / 2; // la cara mira a cámara
          root.add(coin);
          baseRotation = new THREE.Euler(0.15, 0, 0.12);
        } else if (objeto === "losas") {
          const mat = shiny({ metalness: metal * 0.5, roughness: 0.18 });
          for (let i = 0; i < 4; i++) {
            const slab = new THREE.Mesh(new RoundedBoxGeometry(2.4, 3, 0.32, 8, 0.14), mat);
            slab.position.set(i * 0.34 - 0.9, i * 0.12 - 0.18, -i * 0.5);
            root.add(slab);
          }
          baseRotation = new THREE.Euler(-0.35, -0.6, 0.2);
          turntable = false; // un balanceo: las losas de espaldas no dicen nada
          camera.position.z = 10;
        } else if (objeto === "modelo") {
          // GLB propio (Blender, Spline, Sketchfab…). El runtime espera a que
          // cargue (DefaultLoadingManager) antes de capturar.
          new GLTFLoader().load(modeloSrc, (gltf) => {
            const model = gltf.scene;
            const box = new THREE.Box3().setFromObject(model);
            const size = box.getSize(new THREE.Vector3());
            model.position.sub(box.getCenter(new THREE.Vector3()));
            const fit = new THREE.Group();
            fit.scale.setScalar(3.2 / Math.max(size.x, size.y, size.z));
            fit.add(model);
            if (tenir) {
              model.traverse((o) => {
                if (!o.isMesh) return;
                o.material = o.material.clone();
                o.material.color = color.clone();
                o.material.metalness = metal;
              });
            }
            root.add(fit);
            renderAt(lastTime);
          });
          baseRotation = new THREE.Euler(0.1, 0, 0);
        } else {
          const label = faceTexture({
            w: 1360,
            h: 856,
            bg: `#${color.getHexString()}`,
            draw(g, w, h) {
              g.fillStyle = "rgba(255,255,255,0.35)";
              g.beginPath();
              g.roundRect(110, 300, 190, 140, 24);
              g.fill();
              g.fillStyle = detalle;
              g.font = "800 96px Arial, Helvetica, sans-serif";
              g.textBaseline = "alphabetic";
              g.fillText(texto, 110, h - 110);
            },
          });
          const geo = new RoundedBoxGeometry(3.4, 2.14, 0.06, 4, 0.03);
          const edge = shiny({ roughness: 0.3 });
          const front = shiny({ map: label, color: 0xffffff, metalness: metal * 0.4 });
          // RoundedBoxGeometry: grupo 4 = cara +z
          const card = new THREE.Mesh(geo, [edge, edge, edge, edge, front, edge]);
          root.add(card);
          baseRotation = new THREE.Euler(0.25, 0, -0.18);
        }

        function renderAt(time) {
          lastTime = time;
          const p = (((time % DURATION) + DURATION) % DURATION) / DURATION;
          const wave = Math.sin(p * Math.PI * 2);
          root.rotation.set(
            baseRotation.x + wave * 0.08,
            baseRotation.y + (turntable ? p * Math.PI * 2 : wave * 0.35),
            baseRotation.z,
          );
          root.position.y = wave * 0.12;
          renderer.render(scene, camera);
        }

        window.addEventListener("hf-seek", (event) => renderAt(event.detail.time));
        renderAt(window.__hfThreeTime || 0);
      </script>
    </div>
  </body>
</html>
