<!doctype html>
<html
  lang="es"
  data-composition-variables='[
    {"id":"brandName","type":"string","label":"Nombre de la marca","default":"Mi Marca"},
    {"id":"storyTitle","type":"string","label":"Titular","default":"Nuevo por aquí"},
    {"id":"storyCta","type":"string","label":"CTA","default":"Desliza ↑"},
    {"id":"brandPrimary","type":"color","label":"Primario","default":"#6d28d9"},
    {"id":"brandSecondary","type":"color","label":"Secundario","default":"#0ea5e9"},
    {"id":"brandBackground","type":"color","label":"Fondo","default":"#0b1220"},
    {"id":"brandText","type":"color","label":"Texto","default":"#f5f5f4"},
    {"id":"brandHeading","type":"string","label":"Fuente titulares","default":"Inter"},
    {"id":"brandBody","type":"string","label":"Fuente texto","default":"Inter"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Historia · WissMotion</title>
    <style>
      html,
      body {
        margin: 0;
        background: #111;
      }
      #stage {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: linear-gradient(180deg, var(--brandPrimary), var(--brandSecondary));
      }
      #bar {
        position: absolute;
        left: 60px;
        right: 60px;
        top: 48px;
        height: 8px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.35);
        overflow: hidden;
      }
      #fill {
        width: 100%;
        height: 100%;
        border-radius: 4px;
        background: #fff;
        transform-origin: left center;
      }
      #brand {
        position: absolute;
        left: 60px;
        top: 110px;
        margin: 0;
        font: 700 44px var(--brandHeading);
        color: #fff;
        opacity: 0.9;
      }
      #title {
        position: absolute;
        left: 60px;
        right: 60px;
        bottom: 420px;
        margin: 0;
        font: 700 110px/1.05 var(--brandHeading);
        color: #fff;
      }
      #cta {
        position: absolute;
        left: 60px;
        right: 60px;
        bottom: 180px;
        padding: 28px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.95);
        color: #1c1917;
        text-align: center;
        font: 700 44px var(--brandBody);
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="historia"
      data-start="0"
      data-width="1080"
      data-height="1920"
    >
      <div id="bar" class="clip" data-start="0" data-duration="6" data-track-index="0">
        <div id="fill"></div>
      </div>
      <p
        id="brand"
        class="clip"
        data-start="0.3"
        data-duration="5.7"
        data-track-index="1"
        data-var-text="brandName"
      >
        Mi Marca
      </p>
      <h1
        id="title"
        class="clip"
        data-start="0.5"
        data-duration="5.5"
        data-track-index="1"
        data-var-text="storyTitle"
      >
        Nuevo por aquí
      </h1>
      <div
        id="cta"
        class="clip"
        data-start="1.0"
        data-duration="5"
        data-track-index="2"
        data-var-text="storyCta"
      >
        Desliza ↑
      </div>
      <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.from("#fill", { scaleX: 0, duration: 6, ease: "none" }, 0);
        tl.from("#brand", { opacity: 0, duration: 0.5, ease: "power2.out" }, 0.3);
        tl.from("#title", { y: 80, opacity: 0, duration: 0.8, ease: "power3.out" }, 0.5);
        tl.from("#cta", { y: 40, opacity: 0, duration: 0.6, ease: "back.out(1.5)" }, 1.0);
        window.__timelines = window.__timelines || {};
        window.__timelines["historia"] = tl;
      </script>
    </div>
  </body>
</html>
