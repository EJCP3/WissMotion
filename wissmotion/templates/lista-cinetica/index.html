<!doctype html>
<html
  lang="es"
  data-composition-variables='[
    {"id":"word1","type":"string","label":"Palabra 1","default":"Gastos"},
    {"id":"word2","type":"string","label":"Palabra 2","default":"Presupuestos"},
    {"id":"word3","type":"string","label":"Palabra 3","default":"Ahorros"},
    {"id":"word4","type":"string","label":"Palabra 4","default":"Reportes"},
    {"id":"word5","type":"string","label":"Palabra 5","default":"Balance"},
    {"id":"word6","type":"string","label":"Palabra 6","default":"Cuentas"},
    {"id":"word7","type":"string","label":"Palabra 7","default":"Alertas"},
    {"id":"word8","type":"string","label":"Palabra 8","default":"Categorías"},
    {"id":"word9","type":"string","label":"Palabra 9","default":"Metas"},
    {"id":"word10","type":"string","label":"Palabra 10","default":"Historial"},
    {"id":"brandBackground","type":"color","label":"Fondo","default":"#000000"},
    {"id":"brandText","type":"color","label":"Texto","default":"#ffffff"},
    {"id":"brandHeading","type":"string","label":"Fuente titulares","default":"Inter"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Lista cinética · WissMotion</title>
    <style>
      html,
      body {
        margin: 0;
        background: #000;
      }
      #stage {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--brandBackground);
      }
      #view {
        position: absolute;
        inset: 0;
        perspective: 900px;
        transform: rotate(-3deg);
      }
      #drum {
        position: absolute;
        left: 540px;
        top: 720px;
        width: 0;
        height: 0;
        transform-style: preserve-3d;
      }
      .w {
        position: absolute;
        left: -540px;
        top: -85px;
        width: 1080px;
        height: 170px;
        display: flex;
        align-items: center;
        gap: 24px;
        padding-left: 70px;
        font: 700 84px var(--brandHeading);
        color: var(--brandText);
        white-space: nowrap;
        opacity: 0.38;
        filter: blur(10px);
        backface-visibility: hidden;
      }
      .w .arr {
        opacity: 0;
      }
      #w0 {
        opacity: 1;
        filter: blur(0px);
      }
      #w0 .arr {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="lista-cinetica"
      data-start="0"
      data-width="1080"
      data-height="1920"
    >
      <div id="view">
        <div id="drum" class="clip" data-start="0" data-duration="9" data-track-index="0">
          <div class="w" id="w0">
            <span class="arr">→</span><span data-var-text="word1">Gastos</span>
          </div>
          <div class="w" id="w1">
            <span class="arr">→</span><span data-var-text="word2">Presupuestos</span>
          </div>
          <div class="w" id="w2">
            <span class="arr">→</span><span data-var-text="word3">Ahorros</span>
          </div>
          <div class="w" id="w3">
            <span class="arr">→</span><span data-var-text="word4">Reportes</span>
          </div>
          <div class="w" id="w4">
            <span class="arr">→</span><span data-var-text="word5">Balance</span>
          </div>
          <div class="w" id="w5">
            <span class="arr">→</span><span data-var-text="word6">Cuentas</span>
          </div>
          <div class="w" id="w6">
            <span class="arr">→</span><span data-var-text="word7">Alertas</span>
          </div>
          <div class="w" id="w7">
            <span class="arr">→</span><span data-var-text="word8">Categorías</span>
          </div>
          <div class="w" id="w8">
            <span class="arr">→</span><span data-var-text="word9">Metas</span>
          </div>
          <div class="w" id="w9">
            <span class="arr">→</span><span data-var-text="word10">Historial</span>
          </div>
        </div>
      </div>
      <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
      <script>
        const STEP = 36,
          T0 = 0.5,
          GAP = 0.8,
          R = 239;
        const WIDS = ["#w0", "#w1", "#w2", "#w3", "#w4", "#w5", "#w6", "#w7", "#w8", "#w9"];
        const tl = gsap.timeline({ paused: true });
        for (let i = 0; i < 10; i++) {
          tl.set(WIDS[i], { rotationX: -i * STEP, transformOrigin: "50% 50% -" + R + "px" }, 0);
        }
        for (let i = 1; i < 10; i++) {
          const t = T0 + i * GAP;
          tl.to("#drum", { rotationX: i * STEP, duration: 0.45, ease: "back.out(1.3)" }, t);
          tl.to("#drum", { scaleY: 1.05, duration: 0.22, ease: "power2.in" }, t);
          tl.to("#drum", { scaleY: 1, duration: 0.23, ease: "power2.out" }, t + 0.22);
          tl.to(
            [WIDS[i - 1], WIDS[i]],
            { filter: "blur(14px)", duration: 0.18, ease: "power2.in" },
            t,
          );
          tl.to(
            WIDS[i],
            { opacity: 1, filter: "blur(0px)", duration: 0.35, ease: "power2.out" },
            t + 0.18,
          );
          tl.to(WIDS[i] + " .arr", { opacity: 1, duration: 0.25 }, t + 0.18);
          tl.to(WIDS[i - 1], { opacity: 0.38, filter: "blur(10px)", duration: 0.35 }, t + 0.18);
          tl.to(WIDS[i - 1] + " .arr", { opacity: 0, duration: 0.25 }, t + 0.18);
        }
        tl.to("#stage", { opacity: 0, duration: 0.4, ease: "power2.in" }, 8.6);
        window.__timelines = window.__timelines || {};
        window.__timelines["lista-cinetica"] = tl;
      </script>
    </div>
  </body>
</html>
