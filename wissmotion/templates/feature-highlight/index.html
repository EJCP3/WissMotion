<!doctype html>
<html
  lang="es"
  data-composition-variables='[
    {"id":"featureTitle","type":"string","label":"Título del feature","default":"Modo sin conexión"},
    {"id":"featureDesc","type":"string","label":"Descripción","default":"Todo tu trabajo, disponible sin internet"},
    {"id":"brandAccent","type":"color","label":"Acento","default":"#f59e0b"},
    {"id":"brandBackground","type":"color","label":"Fondo","default":"#0b1220"},
    {"id":"brandText","type":"color","label":"Texto","default":"#f5f5f4"},
    {"id":"brandHeading","type":"string","label":"Fuente titulares","default":"Inter"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <link
      data-wm-fonts
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=block"
    />
    <title>Feature Highlight · WissMotion</title>
    <style>
      html,
      body {
        margin: 0;
        background: #111;
      }
      #stage {
        position: relative;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: var(--brandBackground);
      }
      #kicker {
        position: absolute;
        left: 140px;
        top: 200px;
        margin: 0;
        font: 700 30px var(--brandHeading);
        letter-spacing: 4px;
        color: var(--brandAccent);
      }
      #title {
        position: absolute;
        left: 140px;
        top: 250px;
        width: 1000px;
        margin: 0;
        font: 700 96px/1.05 var(--brandHeading);
        color: var(--brandText);
        overflow: hidden;
      }
      #bar {
        position: absolute;
        left: 140px;
        top: 490px;
        width: 120px;
        height: 8px;
        border-radius: 4px;
        background: var(--brandAccent);
      }
      #desc {
        position: absolute;
        left: 140px;
        top: 520px;
        width: 800px;
        margin: 0;
        font: 400 34px var(--brandHeading);
        color: var(--brandText);
        opacity: 0.75;
      }

      /* ── Multiformato (wissmotion/templates/formats.mjs) ── */
      /* 9:16 — vertical para Reels/TikTok/Shorts */
      #stage[data-format="9:16"] #kicker {
        left: 90px;
        top: 600px;
        font-size: 40px;
      }
      #stage[data-format="9:16"] #title {
        left: 90px;
        top: 670px;
        width: 900px;
        font-size: 128px;
      }
      #stage[data-format="9:16"] #bar {
        left: 90px;
        top: 1120px;
        width: 160px;
        height: 10px;
      }
      #stage[data-format="9:16"] #desc {
        left: 90px;
        top: 1170px;
        width: 900px;
        font-size: 48px;
      }
      /* 1:1 — cuadrado */
      #stage[data-format="1:1"] #kicker {
        left: 90px;
        top: 310px;
        font-size: 32px;
      }
      #stage[data-format="1:1"] #title {
        left: 90px;
        top: 365px;
        width: 900px;
        font-size: 100px;
      }
      #stage[data-format="1:1"] #bar {
        left: 90px;
        top: 640px;
      }
      #stage[data-format="1:1"] #desc {
        left: 90px;
        top: 675px;
        width: 880px;
        font-size: 38px;
      }
      /* 4:5 — feed */
      #stage[data-format="4:5"] #kicker {
        left: 90px;
        top: 390px;
        font-size: 34px;
      }
      #stage[data-format="4:5"] #title {
        left: 90px;
        top: 445px;
        width: 900px;
        font-size: 108px;
      }
      #stage[data-format="4:5"] #bar {
        left: 90px;
        top: 740px;
      }
      #stage[data-format="4:5"] #desc {
        left: 90px;
        top: 775px;
        width: 880px;
        font-size: 40px;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="feature-highlight"
      data-start="0"
      data-width="1280"
      data-height="720"
    >
      <p id="kicker" class="clip" data-start="0.4" data-duration="7" data-track-index="0">NUEVO</p>
      <h1
        id="title"
        class="clip"
        data-start="0.5"
        data-duration="7"
        data-track-index="0"
        data-var-text="featureTitle"
      >
        Modo sin conexión
      </h1>
      <div id="bar" class="clip" data-start="0.9" data-duration="6.6" data-track-index="1"></div>
      <p
        id="desc"
        class="clip"
        data-start="1.1"
        data-duration="6.4"
        data-track-index="0"
        data-var-text="featureDesc"
      >
        Todo tu trabajo, disponible sin internet
      </p>
      <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.from("#kicker", { opacity: 0, x: -30, duration: 0.5, ease: "power2.out" }, 0.4);
        tl.from("#title", { y: "100%", duration: 0.8, ease: "power3.out" }, 0.5);
        tl.from(
          "#bar",
          { scaleX: 0, transformOrigin: "left center", duration: 0.6, ease: "power3.out" },
          0.9,
        );
        tl.from("#desc", { opacity: 0, y: 20, duration: 0.6, ease: "power2.out" }, 1.1);
        tl.to("#stage", { opacity: 0, duration: 0.4, ease: "power2.in" }, 7.6);
        window.__timelines = window.__timelines || {};
        window.__timelines["feature-highlight"] = tl;
      </script>
    </div>
  </body>
</html>
