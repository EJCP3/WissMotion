<!doctype html>
<html
  lang="es"
  data-composition-variables='[
    {"id":"word","type":"string","label":"Nombre (hasta 10 letras)","default":"SKILLRY"},
    {"id":"kicker","type":"string","label":"Etiqueta superior","default":"AGENT SKILLS WITH TASTE"},
    {"id":"tagline","type":"string","label":"Frase final","default":"El gusto es nuestro. El trabajo, de tu agente."},
    {"id":"brandBackground","type":"color","label":"Fondo","default":"#121216"},
    {"id":"brandText","type":"color","label":"Texto","default":"#f3f1ec"},
    {"id":"brandPrimary","type":"color","label":"Ficha 1","default":"#5b3df5"},
    {"id":"brandAccent","type":"color","label":"Ficha 2","default":"#ff5a36"},
    {"id":"tileColor3","type":"color","label":"Ficha 3","default":"#d4ff3a"},
    {"id":"brandHeading","type":"string","label":"Fuente titulares","default":"Inter"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <link
      data-wm-fonts
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=block"
    />
    <title>Fichas de logo · WissMotion</title>
    <style>
      html,
      body {
        margin: 0;
        background: #111;
      }
      #stage {
        --tile: 108px;
        position: relative;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background-color: var(--brandBackground);
        /* Rejilla de puntos de fondo (estática). */
        background-image: radial-gradient(
          circle,
          color-mix(in srgb, var(--brandText) 16%, transparent) 2px,
          transparent 2.6px
        );
        background-size: 64px 64px;
        background-position: 32px 32px;
      }
      #kicker {
        position: absolute;
        left: 0;
        right: 0;
        top: 170px;
        margin: 0;
        text-align: center;
        font: 700 15px var(--brandHeading);
        letter-spacing: 4px;
        color: var(--brandText);
        opacity: 0.7;
      }
      #tiles {
        position: absolute;
        left: 0;
        right: 0;
        top: 280px;
        display: flex;
        justify-content: center;
        gap: calc(var(--tile) * 0.13);
      }
      .tile {
        display: flex;
        align-items: center;
        justify-content: center;
        width: var(--tile);
        height: var(--tile);
        border-radius: calc(var(--tile) * 0.08);
        font: 800 calc(var(--tile) * 0.62) / 1 var(--brandHeading);
      }
      #tagline {
        position: absolute;
        left: 60px;
        right: 60px;
        top: 470px;
        margin: 0;
        text-align: center;
        font: 500 24px var(--brandHeading);
        color: var(--brandText);
      }

      /* ── Multiformato (wissmotion/templates/formats.mjs) ── */
      /* 9:16 — vertical para Reels/TikTok/Shorts */
      #stage[data-format="9:16"] #kicker {
        top: 780px;
        font-size: 22px;
      }
      #stage[data-format="9:16"] #tiles {
        top: 880px;
      }
      #stage[data-format="9:16"] #tagline {
        top: 1060px;
        font-size: 36px;
      }
      /* 1:1 — cuadrado */
      #stage[data-format="1:1"] #kicker {
        top: 380px;
        font-size: 17px;
      }
      #stage[data-format="1:1"] #tiles {
        top: 470px;
      }
      #stage[data-format="1:1"] #tagline {
        top: 640px;
        font-size: 28px;
      }
      /* 4:5 — feed */
      #stage[data-format="4:5"] #kicker {
        top: 500px;
        font-size: 18px;
      }
      #stage[data-format="4:5"] #tiles {
        top: 590px;
      }
      #stage[data-format="4:5"] #tagline {
        top: 760px;
        font-size: 30px;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="fichas-logo"
      data-start="0"
      data-width="1280"
      data-height="720"
    >
      <p
        id="kicker"
        class="clip"
        data-start="0"
        data-duration="4.5"
        data-track-index="0"
        data-var-text="kicker"
      >
        AGENT SKILLS WITH TASTE
      </p>
      <div id="tiles" class="clip" data-start="0" data-duration="4.5" data-track-index="1"></div>
      <p
        id="tagline"
        class="clip"
        data-start="0"
        data-duration="4.5"
        data-track-index="2"
        data-var-text="tagline"
      >
        El gusto es nuestro. El trabajo, de tu agente.
      </p>
      <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
      <script>
        (function () {
          var vars =
            window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
              ? window.__hyperframes.getVariables() || {}
              : {};
          function color(value, fallback) {
            return typeof value === "string" && CSS.supports("color", value.trim())
              ? value.trim()
              : fallback;
          }
          // Texto oscuro sobre fichas claras y claro sobre oscuras (luminancia sRGB).
          function inkFor(bg) {
            var probe = document.createElement("span");
            probe.style.color = bg;
            document.body.appendChild(probe);
            var rgb = getComputedStyle(probe).color.match(/\d+/g).map(Number);
            probe.remove();
            var l = (0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2]) / 255;
            return l > 0.55 ? "#121216" : "#ffffff";
          }
          var word = String(vars.word || "SKILLRY")
            .trim()
            .toUpperCase()
            .slice(0, 10);
          var palette = [
            color(vars.brandPrimary, "#5b3df5"),
            color(vars.brandAccent, "#ff5a36"),
            color(vars.tileColor3, "#d4ff3a"),
            // 4.ª ficha = color de texto: siempre contrasta con el fondo.
            color(vars.brandText, "#f3f1ec"),
          ];
          // Tamaño de ficha según formato y nº de letras: grande pero sin salirse.
          var stage = document.getElementById("stage");
          var w = Number(stage.dataset.width) || 1280;
          var h = Number(stage.dataset.height) || 720;
          var base = h > w ? 136 : w === h ? 116 : h > 1000 ? 120 : 108;
          var fit = Math.floor((w - 100) / (Math.max(word.length, 1) * 1.13));
          stage.style.setProperty("--tile", Math.min(base, fit) + "px");
          var box = document.getElementById("tiles");
          Array.from(word).forEach(function (ch, i) {
            var tile = document.createElement("span");
            tile.className = "tile";
            tile.textContent = ch === " " ? "" : ch;
            tile.style.background = palette[i % palette.length];
            tile.style.color = inkFor(palette[i % palette.length]);
            box.appendChild(tile);
          });

          var tl = gsap.timeline({ paused: true });
          tl.fromTo(
            "#kicker",
            { opacity: 0, y: -10 },
            { opacity: 0.7, y: 0, duration: 0.5, ease: "power2.out" },
            0.1,
          );
          // Llegan desde la derecha girando y desenfocadas, en cascada.
          tl.fromTo(
            "#tiles .tile",
            { x: 260, rotation: 40, scale: 0.6, opacity: 0, filter: "blur(10px)" },
            {
              x: 0,
              rotation: 0,
              scale: 1,
              opacity: 1,
              filter: "blur(0px)",
              duration: 0.8,
              ease: "expo.out",
              stagger: 0.07,
            },
            0.3,
          );
          tl.fromTo(
            "#tagline",
            { opacity: 0, y: 14 },
            { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
            1.5,
          );
          tl.to("#stage", { opacity: 0, duration: 0.4, ease: "power2.in" }, 4.1);
          window.__timelines = window.__timelines || {};
          window.__timelines["fichas-logo"] = tl;
        })();
      </script>
    </div>
  </body>
</html>
