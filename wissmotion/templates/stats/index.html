<!doctype html>
<html
  lang="es"
  data-composition-variables='[
    {"id":"stat1Value","type":"string","label":"Cifra 1","default":"+120%"},
    {"id":"stat1Label","type":"string","label":"Etiqueta 1","default":"crecimiento"},
    {"id":"stat2Value","type":"string","label":"Cifra 2","default":"4.9"},
    {"id":"stat2Label","type":"string","label":"Etiqueta 2","default":"valoración media"},
    {"id":"stat3Value","type":"string","label":"Cifra 3","default":"2M"},
    {"id":"stat3Label","type":"string","label":"Etiqueta 3","default":"usuarios"},
    {"id":"brandPrimary","type":"color","label":"Primario","default":"#6d28d9"},
    {"id":"brandBackground","type":"color","label":"Fondo","default":"#faf9f7"},
    {"id":"brandText","type":"color","label":"Texto","default":"#1c1917"},
    {"id":"brandHeading","type":"string","label":"Fuente titulares","default":"Inter"},
    {"id":"brandBody","type":"string","label":"Fuente texto","default":"Inter"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Stats · WissMotion</title>
    <style>
      html,
      body {
        margin: 0;
        background: #111;
      }
      #stage {
        position: relative;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: var(--brandBackground);
      }
      .stat {
        position: absolute;
        top: 230px;
        width: 300px;
        text-align: center;
      }
      #s1 {
        left: 140px;
      }
      #s2 {
        left: 490px;
      }
      #s3 {
        left: 840px;
      }
      .num {
        margin: 0;
        font: 700 110px var(--brandHeading);
        color: var(--brandPrimary);
        font-variant-numeric: tabular-nums;
      }
      .lbl {
        margin: 8px 0 0;
        font: 400 30px var(--brandBody);
        color: var(--brandText);
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="stats" data-start="0" data-width="1280" data-height="720">
      <div id="s1" class="stat clip" data-start="0.4" data-duration="5.6" data-track-index="0">
        <p class="num" data-var-text="stat1Value">+120%</p>
        <p class="lbl" data-var-text="stat1Label">crecimiento</p>
      </div>
      <div id="s2" class="stat clip" data-start="0.4" data-duration="5.6" data-track-index="1">
        <p class="num" data-var-text="stat2Value">4.9</p>
        <p class="lbl" data-var-text="stat2Label">valoración media</p>
      </div>
      <div id="s3" class="stat clip" data-start="0.4" data-duration="5.6" data-track-index="2">
        <p class="num" data-var-text="stat3Value">2M</p>
        <p class="lbl" data-var-text="stat3Label">usuarios</p>
      </div>
      <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.from(
          ".stat",
          { scale: 0.85, opacity: 0, duration: 0.7, ease: "back.out(1.5)", stagger: 0.15 },
          0.4,
        );
        tl.to(".stat", { opacity: 0, duration: 0.4, ease: "power2.in" }, 5.6);
        window.__timelines = window.__timelines || {};
        window.__timelines["stats"] = tl;
      </script>
    </div>
  </body>
</html>
