<!doctype html>
<html
  lang="es"
  data-composition-variables='[
    {"id":"offerTitle","type":"string","label":"Título de la oferta","default":"-30% plan anual"},
    {"id":"offerDesc","type":"string","label":"Descripción","default":"Solo esta semana. Sin letra pequeña."},
    {"id":"ctaLabel","type":"string","label":"Texto del CTA","default":"Lo quiero"},
    {"id":"brandPrimary","type":"color","label":"Primario","default":"#6d28d9"},
    {"id":"brandAccent","type":"color","label":"Acento","default":"#f59e0b"},
    {"id":"brandBackground","type":"color","label":"Fondo","default":"#0b1220"},
    {"id":"brandText","type":"color","label":"Texto","default":"#f5f5f4"},
    {"id":"brandHeading","type":"string","label":"Fuente titulares","default":"Inter"},
    {"id":"brandBody","type":"string","label":"Fuente texto","default":"Inter"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Oferta · WissMotion</title>
    <style>
      html,
      body {
        margin: 0;
        background: #111;
      }
      #stage {
        position: relative;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: var(--brandBackground);
      }
      #badge {
        position: absolute;
        left: 540px;
        top: 120px;
        padding: 10px 28px;
        border-radius: 999px;
        background: var(--brandAccent);
        color: #1c1917;
        font: 700 28px var(--brandBody);
        letter-spacing: 3px;
      }
      #title {
        position: absolute;
        left: 0;
        right: 0;
        top: 220px;
        margin: 0;
        text-align: center;
        font: 700 110px var(--brandHeading);
        color: var(--brandText);
      }
      #desc {
        position: absolute;
        left: 0;
        right: 0;
        top: 370px;
        margin: 0;
        text-align: center;
        font: 400 34px var(--brandBody);
        color: var(--brandText);
        opacity: 0.8;
      }
      #cta {
        position: absolute;
        left: 490px;
        top: 470px;
        padding: 20px 72px;
        border-radius: 999px;
        background: var(--brandPrimary);
        color: #fff;
        font: 700 40px var(--brandBody);
      }

      /* ── Multiformato (wissmotion/templates/formats.mjs) ── */
      /* 9:16 — vertical para Reels/TikTok/Shorts */
      #stage[data-format="9:16"] #badge {
        left: 0;
        right: 0;
        width: fit-content;
        margin: 0 auto;
        top: 560px;
        font-size: 38px;
      }
      #stage[data-format="9:16"] #title {
        left: 40px;
        right: 40px;
        top: 640px;
        font-size: 150px;
        line-height: 1.05;
      }
      #stage[data-format="9:16"] #desc {
        left: 70px;
        right: 70px;
        top: 1010px;
        font-size: 48px;
      }
      #stage[data-format="9:16"] #cta {
        left: 0;
        right: 0;
        width: fit-content;
        margin: 0 auto;
        top: 1140px;
        font-size: 54px;
        padding: 26px 90px;
      }
      /* 1:1 — cuadrado */
      #stage[data-format="1:1"] #badge {
        left: 0;
        right: 0;
        width: fit-content;
        margin: 0 auto;
        top: 300px;
      }
      #stage[data-format="1:1"] #title {
        left: 30px;
        right: 30px;
        top: 390px;
        font-size: 110px;
      }
      #stage[data-format="1:1"] #desc {
        left: 60px;
        right: 60px;
        top: 545px;
        font-size: 36px;
      }
      #stage[data-format="1:1"] #cta {
        left: 0;
        right: 0;
        width: fit-content;
        margin: 0 auto;
        top: 650px;
      }
      /* 4:5 — feed */
      #stage[data-format="4:5"] #badge {
        left: 0;
        right: 0;
        width: fit-content;
        margin: 0 auto;
        top: 380px;
        font-size: 30px;
      }
      #stage[data-format="4:5"] #title {
        left: 30px;
        right: 30px;
        top: 475px;
        font-size: 116px;
      }
      #stage[data-format="4:5"] #desc {
        left: 60px;
        right: 60px;
        top: 635px;
        font-size: 38px;
      }
      #stage[data-format="4:5"] #cta {
        left: 0;
        right: 0;
        width: fit-content;
        margin: 0 auto;
        top: 745px;
      }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="oferta" data-start="0" data-width="1280" data-height="720">
      <div id="badge" class="clip" data-start="0.3" data-duration="5.7" data-track-index="0">
        OFERTA
      </div>
      <h1
        id="title"
        class="clip"
        data-start="0.5"
        data-duration="5.5"
        data-track-index="0"
        data-var-text="offerTitle"
      >
        -30% plan anual
      </h1>
      <p
        id="desc"
        class="clip"
        data-start="0.9"
        data-duration="5.1"
        data-track-index="0"
        data-var-text="offerDesc"
      >
        Solo esta semana. Sin letra pequeña.
      </p>
      <div
        id="cta"
        class="clip"
        data-start="1.3"
        data-duration="4.7"
        data-track-index="1"
        data-var-text="ctaLabel"
      >
        Lo quiero
      </div>
      <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.from("#badge", { scale: 0, duration: 0.6, ease: "back.out(1.7)" }, 0.3);
        tl.from("#title", { scale: 0.9, opacity: 0, duration: 0.7, ease: "power3.out" }, 0.5);
        tl.from("#desc", { opacity: 0, y: 20, duration: 0.6, ease: "power2.out" }, 0.9);
        tl.from("#cta", { scale: 0.6, opacity: 0, duration: 0.6, ease: "back.out(1.7)" }, 1.3);
        tl.to(
          "#cta",
          { scale: 1.05, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 3 },
          2.5,
        );
        tl.to("#stage", { opacity: 0, duration: 0.5, ease: "power2.in" }, 5.5);
        window.__timelines = window.__timelines || {};
        window.__timelines["oferta"] = tl;
      </script>
    </div>
  </body>
</html>
