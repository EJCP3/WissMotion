<!doctype html>
<html
  lang="es"
  data-composition-variables='[
    {"id":"launchName","type":"string","label":"Nombre del lanzamiento","default":"Versión 2.0"},
    {"id":"launchDate","type":"string","label":"Fecha","default":"Disponible el viernes"},
    {"id":"brandPrimary","type":"color","label":"Primario","default":"#6d28d9"},
    {"id":"brandAccent","type":"color","label":"Acento","default":"#f59e0b"},
    {"id":"brandBackground","type":"color","label":"Fondo","default":"#0b1220"},
    {"id":"brandText","type":"color","label":"Texto","default":"#f5f5f4"},
    {"id":"brandHeading","type":"string","label":"Fuente titulares","default":"Inter"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Lanzamiento · WissMotion</title>
    <style>
      html,
      body {
        margin: 0;
        background: #111;
      }
      #stage {
        position: relative;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: var(--brandBackground);
      }
      .num {
        position: absolute;
        left: 0;
        right: 0;
        top: 180px;
        margin: 0;
        text-align: center;
        font: 700 220px var(--brandHeading);
        color: var(--brandText);
        font-variant-numeric: tabular-nums;
      }
      #name {
        position: absolute;
        left: 0;
        right: 0;
        top: 470px;
        margin: 0;
        text-align: center;
        font: 700 72px var(--brandHeading);
        color: var(--brandAccent);
      }
      #date {
        position: absolute;
        left: 0;
        right: 0;
        top: 570px;
        margin: 0;
        text-align: center;
        font: 400 34px var(--brandHeading);
        color: var(--brandText);
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="lanzamiento"
      data-start="0"
      data-width="1280"
      data-height="720"
    >
      <p id="n3" class="num clip" data-start="0.3" data-duration="1" data-track-index="0">3</p>
      <p id="n2" class="num clip" data-start="1.3" data-duration="1" data-track-index="1">2</p>
      <p id="n1" class="num clip" data-start="2.3" data-duration="1" data-track-index="2">1</p>
      <h1
        id="name"
        class="clip"
        data-start="3.4"
        data-duration="2.6"
        data-track-index="3"
        data-var-text="launchName"
      >
        Versión 2.0
      </h1>
      <p
        id="date"
        class="clip"
        data-start="3.8"
        data-duration="2.2"
        data-track-index="3"
        data-var-text="launchDate"
      >
        Disponible el viernes
      </p>
      <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.from("#n3", { scale: 1.6, opacity: 0, duration: 0.4, ease: "power2.out" }, 0.3);
        tl.to("#n3", { scale: 0.8, opacity: 0, duration: 0.3, ease: "power2.in" }, 1.0);
        tl.from("#n2", { scale: 1.6, opacity: 0, duration: 0.4, ease: "power2.out" }, 1.3);
        tl.to("#n2", { scale: 0.8, opacity: 0, duration: 0.3, ease: "power2.in" }, 2.0);
        tl.from("#n1", { scale: 1.6, opacity: 0, duration: 0.4, ease: "power2.out" }, 2.3);
        tl.to("#n1", { scale: 0.8, opacity: 0, duration: 0.3, ease: "power2.in" }, 3.0);
        tl.from("#name", { scale: 0.85, opacity: 0, duration: 0.7, ease: "back.out(1.5)" }, 3.4);
        tl.from("#date", { opacity: 0, y: 20, duration: 0.6, ease: "power2.out" }, 3.8);
        tl.to("#stage", { opacity: 0, duration: 0.5, ease: "power2.in" }, 5.5);
        window.__timelines = window.__timelines || {};
        window.__timelines["lanzamiento"] = tl;
      </script>
    </div>
  </body>
</html>
